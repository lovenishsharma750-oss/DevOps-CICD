
name: DevOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify project file
        run: test -f index.html

      - name: Display success message
        run: echo "CI pipeline completed successfully!"
